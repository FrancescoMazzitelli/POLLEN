events {}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # =========================================================
    # MICROCKS
    # =========================================================

    server {

        listen 8080;

        server_name mock.172.31.20.10.nip.io;

        location / {
            proxy_pass http://mock-server:8080;
        }
    }

    # =========================================================
    # CONSUL
    # =========================================================

    server {

        listen 8080;

        server_name consul.172.31.20.10.nip.io;

        location / {
            proxy_pass http://registry:8500;
        }
    }

    # =========================================================
    # MONGO EXPRESS
    # =========================================================

    server {

        listen 8080;

        server_name mongo.172.31.20.10.nip.io;

        location / {
            proxy_pass http://catalog-gui:8081;
        }
    }

    # =========================================================
    # CATALOG
    # =========================================================

    server {

        listen 8080;

        server_name catalog.172.31.20.10.nip.io;

        location / {
            proxy_pass http://catalog-gateway:5000;
        }
    }

    # =========================================================
    # CONTROL
    # =========================================================

    server {

        listen 8080;

        server_name control.172.31.20.10.nip.io;

        location / {
            proxy_pass http://control-unit:5500;
        }
    }
}